server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point, so a new deploy is picked up immediately
    # without needing a manual hard-refresh (the hashed assets it references are
    # still long-cached below).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
