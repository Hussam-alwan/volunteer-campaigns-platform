spring:
  application:
    name: impact
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/impact}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:P4ssword!}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/impact}

jwt:
  auth:
    converter:
      resource-id: ${KEYCLOAK_CLIENT_ID:impact-app}
      principle-attribute: ${KEYCLOAK_PRINCIPLE_ATTRIBUTE:preferred_username}

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    http-statuses:
      java.lang.IllegalArgumentException: BAD_REQUEST
    codes:
      java.lang.IllegalArgumentException: BAD_REQUEST

springdoc:
  pathsToMatch: /, /api/**

server:
  port: 8080
  forward-headers-strategy: framework

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads/photos}
