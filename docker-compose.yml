services:

  postgresql:
    image: postgres:16-alpine
    container_name: impact-postgres
    environment:
      POSTGRES_DB: impact
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P4ssword!
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impact"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impact-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/impact
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: P4ssword!
      APP_UPLOAD_DIR: /app/uploads/photos
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./my-dashboard
      dockerfile: Dockerfile
    container_name: impact-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres:
  backend-uploads:
