services:
  db:
    image: postgres:16-alpine
    container_name: impact-postgres
    environment:
      POSTGRES_DB: impact
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P4ssword!
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impact"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impact-backend
    environment:
      # talk to the db service over the compose network (internal port 5432)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/impact
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: P4ssword!
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      APP_UPLOAD_DIR: /app/uploads/photos
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./my-dashboard
      dockerfile: Dockerfile
      args:
        # baked into the build — the URL the browser uses to reach the backend
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_SERVER_BASE_URL: http://localhost:8080
    container_name: impact-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres:
  uploads:
